<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ST ENTERPRISE - Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif;padding:20px}
.box{max-width:650px;margin:auto;background:#1d1d1d;padding:20px;border-radius:15px}
h1,h2{text-align:center;color:#d4af37}
input,textarea,button{width:100%;padding:12px;margin:7px 0;border-radius:8px;border:1px solid #555;font-size:15px}
input,textarea{background:#292929;color:#fff}
textarea{min-height:100px}
button{background:#d4af37;color:#111;border:0;font-weight:bold;cursor:pointer}
.red{background:#c62828;color:#fff}
.hidden{display:none}
.msg{text-align:center;margin:10px 0;color:#ffd54f}
.product{background:#292929;padding:12px;border-radius:10px;margin:12px 0}
.product img{width:100%;max-height:220px;object-fit:cover;border-radius:8px}
.product b{font-size:18px}
.small{color:#bbb}
</style>
</head>

<body>

<div class="box">

<h1>ST ENTERPRISE</h1>

<div id="loginBox">
<h2>Admin Login</h2>
<input id="email" type="email" value="tayyabali64200@gmail.com" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">LOGIN</button>
<div id="loginMsg" class="msg"></div>
</div>

<div id="adminBox" class="hidden">

<button class="red" onclick="logout()">LOGOUT</button>

<h2>Add Product</h2>

<input id="name" placeholder="Product Name">
<textarea id="description" placeholder="Product Description"></textarea>
<input id="category" placeholder="Category e.g. Wedding Stage">
<input id="price" type="number" placeholder="Price">
<input id="stock" type="number" placeholder="Stock">
<input id="photo" type="file" accept="image/*">

<button onclick="addProduct()">ADD PRODUCT</button>

<div id="msg" class="msg"></div>

<h2>Products</h2>
<div id="products">Loading...</div>

</div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL="https://woiicqehdpjjoztundqe.supabase.co";
const SUPABASE_KEY="sb_publishable_u7HOao33jfANYAi8BEIjxQ_jluHk17f";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

async function login(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const msg=document.getElementById("loginMsg");
 msg.textContent="Login ho raha hai...";
 const {error}=await db.auth.signInWithPassword({email,password});
 if(error){msg.textContent="❌ "+error.message;return}
 msg.textContent="";
 showAdmin();
}

async function logout(){
 await db.auth.signOut();
 showAdmin();
}

async function showAdmin(){
 const {data}=await db.auth.getSession();
 const logged=!!data.session;
 document.getElementById("loginBox").classList.toggle("hidden",logged);
 document.getElementById("adminBox").classList.toggle("hidden",!logged);
 if(logged) loadProducts();
}

async function addProduct(){
 const msg=document.getElementById("msg");
 const name=document.getElementById("name").value.trim();
 const description=document.getElementById("description").value.trim();
 const category=document.getElementById("category").value.trim();
 const price=Number(document.getElementById("price").value)||0;
 const stock=Number(document.getElementById("stock").value)||0;
 const photo=document.getElementById("photo").files[0];

 if(!name){msg.textContent="❌ Product name likho";return}
 if(!photo){msg.textContent="❌ Product photo select karo";return}

 msg.textContent="⏳ Product save ho raha hai...";

 const {data:last}=await db.from("products").select("id").order("id",{ascending:false}).limit(1);
 const newId=last&&last.length ? Number(last[0].id)+1 : 1;

 const fileName=Date.now()+"-"+photo.name.replace(/[^a-zA-Z0-9.-]/g,"-");

 const {error:uploadError}=await db.storage
 .from("product-images")
 .upload(fileName,photo);

 if(uploadError){
   msg.textContent="❌ Photo upload error: "+uploadError.message;
   return;
 }

 const {data:urlData}=db.storage.from("product-images").getPublicUrl(fileName);
 const image_url=urlData.publicUrl;

 const {error}=await db.from("products").insert([{
   id:newId,
   name:name,
   description:description,
   category:category,
   price:price,
   stock:stock,
   image_url:image_url,
   is_featured:false
 }]);

 if(error){
   msg.textContent="❌ Product save error: "+error.message;
   return;
 }

 msg.textContent="✅ Product successfully add ho gaya!";
 document.getElementById("name").value="";
 document.getElementById("description").value="";
 document.getElementById("category").value="";
 document.getElementById("price").value="";
 document.getElementById("stock").value="";
 document.getElementById("photo").value="";

 loadProducts();
}

async function loadProducts(){
 const box=document.getElementById("products");
 box.innerHTML="Loading...";

 const {data,error}=await db.from("products").select("*").order("id",{ascending:false});

 if(error){
   box.innerHTML="❌ "+error.message;
   return;
 }

 if(!data||data.length===0){
   box.innerHTML="<p class='small'>Abhi koi product nahi hai.</p>";
   return;
 }

 box.innerHTML=data.map(p=>`
 <div class="product">
   ${p.image_url?`<img src="${p.image_url}">`:""}
   <p><b>${p.name||""}</b></p>
   <p class="small">${p.description||""}</p>
   <p>Category: ${p.category||"-"}</p>
   <p>Price: ₹${p.price||0} | Stock: ${p.stock||0}</p>
   <button class="red" onclick="deleteProduct(${p.id})">DELETE</button>
 </div>
 `).join("");
}

async function deleteProduct(id){
 if(!confirm("Ye product delete karna hai?"))return;

 const {error}=await db.from("products").delete().eq("id",id);

 if(error){
   alert("Delete error: "+error.message);
   return;
 }

 loadProducts();
}

showAdmin();
</script>

</body>
</html>
