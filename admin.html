<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ST ENTERPRISE Admin</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#080808;
  color:white;
}
.container{
  max-width:600px;
  margin:auto;
  padding:25px 18px;
}
h1{
  color:#d4af37;
  text-align:center;
  margin-bottom:5px;
}
.subtitle{
  text-align:center;
  color:#aaa;
  margin-bottom:25px;
}
.card{
  background:#151515;
  border:1px solid #333;
  border-radius:15px;
  padding:20px;
  margin-bottom:18px;
}
label{
  display:block;
  margin:15px 0 7px;
  color:#d4af37;
  font-weight:bold;
}
input,textarea{
  width:100%;
  padding:13px;
  border-radius:9px;
  border:1px solid #444;
  background:#222;
  color:white;
  font-size:16px;
}
textarea{
  min-height:120px;
  resize:vertical;
}
button{
  width:100%;
  padding:14px;
  margin-top:18px;
  border:0;
  border-radius:10px;
  background:#d4af37;
  color:#000;
  font-size:17px;
  font-weight:bold;
}
button:active{
  transform:scale(.98);
}
.note{
  color:#aaa;
  font-size:13px;
  line-height:1.5;
}
.success{
  display:none;
  background:#174d25;
  padding:12px;
  border-radius:8px;
  margin-top:15px;
  color:#8cff9b;
}
</style>
</head>

<body>

<div class="container">

<h1>ST ENTERPRISE</h1>
<div class="subtitle">Website Admin Panel</div>

<div class="card">

<label>Business Name</label>
<input id="businessName" value="S T ENTERPRISE">

<label>Tagline</label>
<input id="tagline" value="Wedding • Event • Decoration">

<label>Website Description</label>
<textarea id="description">Premium wedding and event decoration items, manufactured and supplied by S T ENTERPRISE, Ajrara, Meerut.</textarea>

<label>WhatsApp Number</label>
<input id="whatsapp" value="7006144420">

<label>Calling Number</label>
<input id="calling" value="87556684770">

<label>Email</label>
<input id="email" value="tayyabali64200@gmail.com">

<label>Instagram</label>
<input id="instagram" value="@s_t_enterprise">

<label>Address</label>
<textarea id="address">Vill. Ajrara, Dist. Meerut, Uttar Pradesh</textarea>

<button onclick="saveData()">SAVE DETAILS</button>

<div id="success" class="success">
✅ Details saved successfully!
</div>

</div>

<div class="card">

<h2 style="color:#d4af37;">Products</h2>

<label>Product 1 Name</label>
<input id="product1" placeholder="Example: Royal Sofa">

<label>Product 2 Name</label>
<input id="product2" placeholder="Example: Wedding Stage">

<label>Product 3 Name</label>
<input id="product3" placeholder="Example: Crystal Jhumer">

<label>Product 4 Name</label>
<input id="product4" placeholder="Example: Entry Gate">

<button onclick="saveProducts()">SAVE PRODUCTS</button>

<div id="productSuccess" class="success">
✅ Products saved successfully!
</div>

</div>

<div class="card">

<h2 style="color:#d4af37;">Important</h2>

<p class="note">
Ye admin panel website ki information ko browser me save karega.
Public website par permanently changes dikhane ke liye
ek baar website ko is admin system se connect karna hoga.
</p>

</div>

</div>

<script>

function saveData(){

localStorage.setItem("st_businessName",
document.getElementById("businessName").value);

localStorage.setItem("st_tagline",
document.getElementById("tagline").value);

localStorage.setItem("st_description",
document.getElementById("description").value);

localStorage.setItem("st_whatsapp",
document.getElementById("whatsapp").value);

localStorage.setItem("st_calling",
document.getElementById("calling").value);

localStorage.setItem("st_email",
document.getElementById("email").value);

localStorage.setItem("st_instagram",
document.getElementById("instagram").value);

localStorage.setItem("st_address",
document.getElementById("address").value);

document.getElementById("success").style.display="block";

setTimeout(()=>{
document.getElementById("success").style.display="none";
},3000);

}

function saveProducts(){

for(let i=1;i<=4;i++){
localStorage.setItem(
"st_product"+i,
document.getElementById("product"+i).value
);
}

document.getElementById("productSuccess").style.display="block";

setTimeout(()=>{
document.getElementById("productSuccess").style.display="none";
},3000);

}

</script>

</body>
</html>
